<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- Dark Rounded Container with Neon Accent Border -->
  <rect width="256" height="256" rx="55" fill="#06090e" stroke="#9ae600" stroke-width="5"/>
  
  <g transform="translate(32, 35) scale(0.75)">
    <!-- Main Clapperboard Body -->
    <rect x="16" y="86" width="224" height="144" rx="22" fill="#0f151d" stroke="#9ae600" stroke-width="7"/>
    
    <!-- Top Angled Clapper Stick (Opened Action Position) -->
    <g transform="rotate(-14, 16, 80)">
      <rect x="16" y="24" width="224" height="52" rx="14" fill="#06090e" stroke="#9ae600" stroke-width="7"/>
      <!-- Slanted Stripes -->
      <polygon points="56,26 84,26 54,74 26,74" fill="#9ae600"/>
      <polygon points="106,26 134,26 104,74 76,74" fill="#9ae600"/>
      <polygon points="156,26 184,26 154,74 126,74" fill="#9ae600"/>
      <polygon points="206,26 234,26 204,74 176,74" fill="#9ae600"/>
    </g>

    <!-- Bottom Clapper Stick Base Stripes -->
    <g>
      <rect x="16" y="86" width="224" height="42" fill="#06090e" stroke="#9ae600" stroke-width="6"/>
      <polygon points="56,88 84,88 56,126 28,126" fill="#9ae600"/>
      <polygon points="106,88 134,88 106,126 78,126" fill="#9ae600"/>
      <polygon points="156,88 184,88 156,126 128,126" fill="#9ae600"/>
      <polygon points="206,88 234,88 206,126 178,126" fill="#9ae600"/>
    </g>

    <!-- Glowing Center Cinema Play Button -->
    <circle cx="128" cy="172" r="30" fill="#9ae600" fill-opacity="0.2" stroke="#9ae600" stroke-width="5"/>
    <polygon points="120,154 146,172 120,190" fill="#9ae600"/>
  </g>
</svg>